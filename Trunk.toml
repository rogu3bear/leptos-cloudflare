[build]
target = "index.html"
dist = "dist"
public_url = "/"
release = false

[watch]
watch = ["src", "style", "index.html", "assets"]

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false

[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cp assets/_headers dist/_headers 2>/dev/null || true"]
