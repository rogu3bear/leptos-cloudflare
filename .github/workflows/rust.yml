name: Template Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-readiness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2

      - name: Install edge build tools (required on clean runners)
        run: |
          cargo install cargo-leptos --locked --version 0.3.5
          cargo install worker-build --locked --version 0.7.5
          cargo install cargo-audit --locked

      - name: Full release readiness verification
        run: ./scripts/verify.sh
