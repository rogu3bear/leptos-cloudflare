name: Template Release Readiness

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  release-readiness:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2

      - name: Install edge build tools
        run: |
          cargo install cargo-leptos --locked --version 0.3.5
          cargo install worker-build --locked --version 0.7.5

      - name: Dependency and toolchain check
        run: ./scripts/check-deps.sh

      - name: Formatting
        run: cargo fmt --check

      - name: SSR compile check
        run: cargo check --features ssr

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Security audit
        run: cargo audit

      - name: Full edge build
        run: bash ./scripts/build-edge.sh

      - name: Wrangler dry run
        run: bunx wrangler@4.83.0 deploy --dry-run
