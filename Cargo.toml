[package]
name = "langual"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vocal capability divergence across human languages — a grounded-truth explorer."

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.105"
