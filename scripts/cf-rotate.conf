# cf-rotate.conf — child tokens for this repo (engine: ~/dev/scripts/cf-rotate.sh)
# child|<env_key>|<ttl_days>|<Permission Group Name>;<...>   (exact CF group names)
# This repository has one Workers Static Assets + SSR release lane and no Pages
# project. The just-in-time child needs Worker deployment and the governed D1
# migration/readback lane only. The operator revokes it after authenticated
# release readback; the one-day TTL is a fail-safe, not a retention target.
child|CLOUDFLARE_API_TOKEN|1|Workers Scripts Write;Workers Scripts Read;D1 Write;D1 Read
